<html>
    <head> 
        <title>Cricket Game</title>
        <link rel="stylesheet" href="cricket.css">
    </head>
    <body>
        <h2>CRICKET GAME</h2>
        <button class="choice-button" onclick= " let ComputerChoice= randomGenerator();
        let result = getResult('Bat',ComputerChoice);showResult('Bat',ComputerChoice,result);" >
        <img src="Images/bat.png" alt="Bat Image" class="choice-image"></button>

        <button class="choice-button" onclick=" ComputerChoice=randomGenerator();
        result=getResult('Ball',ComputerChoice);showResult('Ball',ComputerChoice,result);">
        <img src="Images/ball.png" alt="Ball Image" class="choice-image"></button>

        <button class="choice-button" onclick="ComputerChoice=randomGenerator();
        result=getResult('Stumps',ComputerChoice);showResult('Stumps',ComputerChoice,result);">
        <img src="Images/stump.png" alt="Stumps Image" class="choice-image"></button>

        <h4 id="user-move"></h4>
        <h4 id="Computer-move"></h4>
        <h4 id="result"></h4>
        <h4 id="score"></h4> 

         <button class="reset" onclick="localStorage.clear()
         resetScore()"><img class="reset-button" src="Images/reset.png" alt="Reset Button"></button>

        <script>

            let scoreStr=localStorage.getItem('score');
            let score;
            resetScore(scoreStr);
            function resetScore(scoreStr)
            {
               score = scoreStr? JSON.parse(scoreStr) :
               {
                   win: 0,
                   lost: 0,
                   tie: 0
               };

               score.displayScore = function () 
               {
                   return `Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`;
               };
               showResult();
            }

        function randomGenerator()
        {
            let randomNumber=Math.random()*3;

           if(randomNumber > 0 && randomNumber<=1)
           {
               ComputerChoice='Ball';
           }
           else if(randomNumber > 1 && randomNumber<=2)
           {
              ComputerChoice='Bat';
           }
            else
           {
               ComputerChoice='Stumps';
           }
           return ComputerChoice;
        }
        function getResult(userMove,computerMove)
        {
            if(userMove === 'Bat')
            {
                if(computerMove==='Ball')
                {
                    score.win++;  
                    return 'You Won';  
                }
                else if(computerMove==='Stumps')
                {
                    score.lost++;
                    return 'Computer WON';
                }
                else
                {
                    score.tie++;
                    return `It's a TIE`;
                }

            }
            else if(userMove==='Ball')
            {
                if(computerMove === 'Bat')
                {
                    score.lost++;
                    return'Computer WON';
                }
                else if(computerMove === 'Ball')
                {
                    score.tie++;
                    return`It's a TIE `;
                }
                else
                {
                    score.win++;  
                    return'You WON';
                }
            }
            else
            {
                if(computerMove==='Stumps')
                {
                    score.tie++;
                    return`It's a TIE`;
                }
                else if(computerMove==='Ball')
                {
                    score.lost++;
                    return'Computer WON';
                }
                else
                {
                    score.win++; 
                   return'You WON';
                }
            }
        }
        function showResult(userMove,computerMove,result)
        {
            localStorage.setItem('score',JSON.stringify(score));

            document.querySelector('#user-move').innerText=
            userMove !== undefined ? `Your have chosen ${userMove}` : '';

            document.querySelector('#computer-move').innerText=
            computerMove !== undefined ? `Computer's Choice is ${computerMove}` : '';

            document.querySelector('#result').innerText = result  || '';

            document.querySelector('#score').innerText=`${score.displayScore()}`;

        }
        </script>
    </body>
</html>
